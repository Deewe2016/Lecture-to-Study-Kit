name: Apply direct Supabase video upload

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch project
        run: |
          corepack enable
          pnpm add tus-js-client --filter @workspace/study-kit
          python3 - <<'PY'
          from pathlib import Path

          auth = Path('artifacts/study-kit/src/lib/auth.ts')
          text = auth.read_text()
          if "export function getAccessToken()" not in text:
              text = text.replace("export function getStoredUser(): AuthUser | null {", "export function getAccessToken(): string | null {\n  return readSession()?.access_token || null;\n}\n\nexport function getStoredUser(): AuthUser | null {", 1)
          auth.write_text(text)

          app = Path('artifacts/study-kit/src/App.tsx')
          text = app.read_text()
          if "import * as tus from 'tus-js-client';" not in text:
              text = text.replace("import { ErrorBoundary } from '@/components/error-boundary';", "import * as tus from 'tus-js-client';\nimport { ErrorBoundary } from '@/components/error-boundary';", 1)
          text = text.replace("import { getCurrentUser, getStoredUser, signOut, type AuthUser } from '@/lib/auth';", "import { getCurrentUser, getStoredUser, getAccessToken, signOut, type AuthUser } from '@/lib/auth';", 1)

          old = '''        if (videoFile) {
          const uploadResponse = await fetch('/api/transcribe-video-upload', {
            method: 'POST',
            headers: { 'Content-Type': videoFile.type || 'application/octet-stream', 'X-File-Name': videoFile.name },
            body: videoFile,
          });
          if (!uploadResponse.ok) {
            const payload = await uploadResponse.json().catch(() => null) as { error?: string } | null;
            throw new Error(payload?.error || 'Could not transcribe this upload.');
          }
          transcript = await uploadResponse.json() as { text: string; title: string };
        } else {'''
          new = '''        if (videoFile) {
          const accessToken = getAccessToken();
          const supabaseUrl = (import.meta.env.VITE_SUPABASE_URL || '').replace(/\\/$/, '');
          const projectRef = supabaseUrl.match(/^https?:\\/\\/([a-z0-9]+)\\.supabase\\.co$/i)?.[1];
          if (!accessToken || !projectRef) throw new Error('Your Supabase session is missing or the Supabase URL is not configured correctly.');

          const safeName = videoFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
          const objectName = `${getStoredUser()?.id || 'user'}/${Date.now()}-${safeName}`;
          const publicUrl = await new Promise<string>((resolve, reject) => {
            const upload = new tus.Upload(videoFile, {
              endpoint: `https://${projectRef}.storage.supabase.co/storage/v1/upload/resumable`,
              retryDelays: [0, 3000, 5000, 10000, 20000],
              headers: { authorization: `Bearer ${accessToken}`, apikey: import.meta.env.VITE_SUPABASE_ANON_KEY || '', 'x-upsert': 'false' },
              uploadDataDuringCreation: true,
              removeFingerprintOnSuccess: true,
              chunkSize: 6 * 1024 * 1024,
              metadata: { bucketName: 'video-uploads', objectName, contentType: videoFile.type || 'video/mp4', cacheControl: '3600' },
              onError: (error) => reject(new Error(`Supabase upload failed: ${error.message}`)),
              onProgress: (uploaded, total) => setError(`Uploading video… ${Math.min(99, Math.round((uploaded / total) * 100))}%`),
              onSuccess: () => resolve(`https://${projectRef}.supabase.co/storage/v1/object/public/video-uploads/${objectName.split('/').map(encodeURIComponent).join('/')}`),
            });
            upload.findPreviousUploads().then((previous) => { if (previous.length) upload.resumeFromPreviousUpload(previous[0]); upload.start(); }).catch(reject);
          });

          setError('Video uploaded. Transcribing with Groq…');
          const transcriptionResponse = await fetch('/api/transcribe-video-upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: publicUrl, fileName: videoFile.name, mimeType: videoFile.type || 'video/mp4' }),
          });
          const payload = await transcriptionResponse.json().catch(() => null) as { error?: string; text?: string; title?: string } | null;
          if (!transcriptionResponse.ok) throw new Error(payload?.error || `Transcription failed (${transcriptionResponse.status}).`);
          transcript = payload as { text: string; title: string };
        } else {'''
          if old not in text: raise SystemExit('Expected video upload block not found')
          app.write_text(text.replace(old, new, 1))
          PY

          cat > api/transcribe-video-upload.js <<'EOF'
          export const config = { api: { bodyParser: true } };
          export default async function handler(req, res) {
            if (req.method !== 'POST') return res.status(405).json({ error: 'Method not allowed.' });
            const apiKey = process.env.GROQ_API_KEY;
            if (!apiKey) return res.status(500).json({ error: 'GROQ_API_KEY is not configured in Vercel environment variables.' });
            const { url, fileName } = req.body || {};
            if (!url || typeof url !== 'string') return res.status(400).json({ error: 'No Supabase video URL was provided.' });
            try {
              const parsed = new URL(url);
              if (!parsed.hostname.endsWith('.supabase.co') || !parsed.pathname.includes('/storage/v1/object/public/video-uploads/')) throw new Error('Invalid Supabase Storage URL.');
              const form = new FormData();
              form.append('url', url); form.append('model', 'whisper-large-v3-turbo'); form.append('response_format', 'json');
              const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', { method: 'POST', headers: { Authorization: `Bearer ${apiKey}` }, body: form });
              if (!response.ok) { const body = await response.text().catch(() => ''); let message = body.slice(0, 500); try { message = JSON.parse(body)?.error?.message || message; } catch {} return res.status(response.status).json({ error: `Groq transcription failed: ${message}` }); }
              const data = await response.json();
              if (!data?.text?.trim()) return res.status(422).json({ error: 'No speech was detected in this upload.' });
              return res.status(200).json({ text: data.text.trim(), title: fileName || 'Lecture transcript' });
            } catch (error) { console.error('Video transcription failed:', error); return res.status(500).json({ error: error instanceof Error ? error.message : 'Could not transcribe this upload.' }); }
          }
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/study-kit/package.json pnpm-lock.yaml artifacts/study-kit/src/lib/auth.ts artifacts/study-kit/src/App.tsx api/transcribe-video-upload.js
          git commit -m 'Upload videos directly to Supabase Storage'
          git push
          rm .github/workflows/apply-supabase-upload.yml
          git add .github/workflows/apply-supabase-upload.yml
          git commit -m 'Remove one-time Supabase upload workflow'
          git push
