name: Fix AI Chat routing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply routing fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('artifacts/study-kit/src/App.tsx')
          text = app.read_text()

          if "import AiChatPage from '@/pages/ai-chat';" not in text:
              text = text.replace(
                  "import AuthPage from '@/pages/auth';\n",
                  "import AuthPage from '@/pages/auth';\nimport AiChatPage from '@/pages/ai-chat';\n",
                  1,
              )

          if 'export { AiChatPage };' not in text:
              marker = "import './index.css';\n"
              text = text.replace(marker, marker + "\nexport { AiChatPage };\n", 1)

          ai_nav = """    {\n      href: '/ai-chat',\n      label: 'AI Chat',\n      icon: Sparkles,\n    },\n"""
          if "href: '/ai-chat'" not in text:
              nav_marker = "    {\n      href: '/calendar',\n      label: 'Calendar',\n      icon: CalendarDays,\n    },\n"
              text = text.replace(nav_marker, nav_marker + ai_nav, 1)

          route = """          <Route\n            path=\"/ai-chat\"\n            component={AiChatPage}\n          />\n\n"""
          if 'path="/ai-chat"' not in text:
              route_marker = "          <Route\n            component={NotFound}\n          />"
              text = text.replace(route_marker, route + route_marker, 1)

          app.write_text(text)

          main = Path('artifacts/study-kit/src/main.tsx')
          text = main.read_text()
          text = text.replace("import AIChatPage from './pages/ai-chat';\n", "", 1)

          route_fn = '''function Route({ path, component: Component }: { path: string; component: React.ComponentType }) {\n  const rawPath = window.location.pathname;\n  const currentPath = rawPath.length > 1 ? rawPath.replace(/\\/+$/, '') : rawPath;\n  if (currentPath !== path) return null;\n  return (\n    <ChatShell>\n      <Component />\n    </ChatShell>\n  );\n}\n\n'''
          text = text.replace(route_fn, '', 1)
          text = text.replace("  const isAIChat = path === '/ai-chat';\n", "", 1)
          text = text.replace("      {!isChat && !isAIChat && <ChatNavInjector />}", "      {!isChat && <ChatNavInjector />}", 1)
          old = '''      ) : isAIChat ? (\n        <Route path=\"/ai-chat\" component={AIChatPage} />\n      ) : (\n        <App />\n      )}'''
          new = '''      ) : (\n        <App />\n      )}'''
          if old not in text:
              raise SystemExit('Expected main.tsx AI Chat branch was not found')
          text = text.replace(old, new, 1)
          main.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/study-kit/src/App.tsx artifacts/study-kit/src/main.tsx
          git diff --cached --check
          git diff --cached -- artifacts/study-kit/src/App.tsx artifacts/study-kit/src/main.tsx
          git commit -m "Fix AI Chat route in app router"
          git push

          rm -f .github/workflows/fix-ai-chat-routing.yml
          git add .github/workflows/fix-ai-chat-routing.yml
          git commit -m "Remove temporary AI Chat routing workflow"
          git push
