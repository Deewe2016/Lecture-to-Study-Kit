name: Wire authentication

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-auth:
    if: ${{ !contains(github.event.head_commit.message, '[wire-auth]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wire auth into App
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('artifacts/study-kit/src/App.tsx')
          text = path.read_text()

          if "@/pages/auth" not in text:
              text = text.replace("import NotFound from '@/pages/not-found';", "import NotFound from '@/pages/not-found';\nimport AuthPage from '@/pages/auth';\nimport { getCurrentUser, getStoredUser, signOut, type AuthUser } from '@/lib/auth';")

          text = text.replace(
              "function Shell({ children }: { children: React.ReactNode }) {",
              "function Shell({ children }: { children: React.ReactNode }) {\n  const user = getStoredUser();\n  const displayName = user?.name || 'Student';\n  const hour = new Date().getHours();\n  const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';"
          )

          text = text.replace(
              '<p className="font-mono text-[11px] uppercase tracking-[.2em] text-primary">Good afternoon, Alex</p>',
              '<p className="font-mono text-[11px] uppercase tracking-[.2em] text-primary">{greeting}, {displayName}</p>'
          )

          text = text.replace(
              '<div className="flex h-8 w-8 items-center justify-center rounded-full border border-border bg-secondary text-xs font-medium text-foreground">AL</div>',
              '<button onClick={() => { void signOut().finally(() => window.location.reload()); }} title="Log out" className="flex h-8 w-8 items-center justify-center rounded-full border border-border bg-secondary text-xs font-medium text-foreground hover:border-primary/60" aria-label={`Log out ${displayName}`}>{displayName.slice(0, 2).toUpperCase()}</button>'
          )

          old_router = "function Router() {\n  return <ErrorBoundary><Shell><Switch><Route path=\"/\" component={LibraryPage} /><Route path=\"/new\" component={NewPage} /><Route path=\"/calendar\" component={CalendarPage} /><Route path=\"/kit/:id\" component={KitPage} /><Route component={NotFound} /></Switch></Shell></ErrorBoundary>;\n}\nfunction App() { return <QueryClientProvider client={queryClient}><TooltipProvider><Router /><Toaster /></TooltipProvider></QueryClientProvider>; }\nexport default App;"

          new_router = "function Router() {\n  return <ErrorBoundary><Shell><Switch><Route path=\"/\" component={LibraryPage} /><Route path=\"/new\" component={NewPage} /><Route path=\"/calendar\" component={CalendarPage} /><Route path=\"/kit/:id\" component={KitPage} /><Route component={NotFound} /></Switch></Shell></ErrorBoundary>;\n}\nfunction App() {\n  const [user, setUser] = useState<AuthUser | null>(() => getStoredUser());\n  const [checking, setChecking] = useState(true);\n\n  useEffect(() => {\n    void getCurrentUser().then(setUser).catch(() => setUser(null)).finally(() => setChecking(false));\n  }, []);\n\n  if (checking) return <main className=\"flex min-h-[100dvh] items-center justify-center bg-background text-sm text-muted-foreground\">Loading workspace…</main>;\n  if (!user) return <AuthPage onAuthenticated={setUser} />;\n\n  return <QueryClientProvider client={queryClient}><TooltipProvider><Router /><Toaster /></TooltipProvider></QueryClientProvider>;\n}\nexport default App;"

          if old_router not in text:
              raise SystemExit('Expected Router/App block was not found')
          text = text.replace(old_router, new_router, 1)
          path.write_text(text)
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/study-kit/src/App.tsx
          git diff --cached --quiet || git commit -m 'Wire login and user names [wire-auth]'
          git push
