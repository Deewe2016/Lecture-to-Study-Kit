name: Fix Chat suggestions v4
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('artifacts/study-kit/src/pages/chat.tsx')
          s=p.read_text()
          def req(old,new):
              global s
              if old not in s: raise SystemExit('missing: '+old[:100])
              s=s.replace(old,new,1)
          req("import { useEffect, useMemo, useState } from 'react';", "import { useEffect, useMemo, useRef, useState } from 'react';")
          req("const[convos,setConvos]=useState<Conversation[]>([]);", "const[convos,setConvos]=useState<Conversation[]>([]);const convosRef=useRef<Conversation[]>([]);")
          req("const selected=useMemo(()=>convos.find(c=>c.id===selectedId)||null,[convos,selectedId]);", "convosRef.current=convos;\n const selected=useMemo(()=>convos.find(c=>c.id===selectedId)||null,[convos,selectedId]);")
          old="const r=await fetch('/api/tutor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:`You are generating reply suggestions for a study workspace chat. Use the last five real messages as context. Return exactly 3 short, natural reply suggestions as a JSON array of strings. No markdown or explanation.\\n${JSON.stringify(context)}`,context:JSON.stringify(context)})});if(!r.ok)throw new Error('Tutor failed');return parseSuggestions(await r.text())"
          new="const controller=new AbortController();const timeout=window.setTimeout(()=>controller.abort(),1800);try{const r=await fetch('/api/tutor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:`You are generating reply suggestions for a study workspace chat. Use ONLY the last five real messages as context. Return exactly 3 short, natural reply suggestions as a JSON array of strings. No markdown or explanation.\\n${JSON.stringify(context)}`,context:JSON.stringify(context),suggestions:true}),signal:controller.signal});if(!r.ok)throw new Error('Tutor failed');return parseSuggestions(await r.text())}finally{window.clearTimeout(timeout)}"
          req(old,new)
          marker="\n useEffect(()=>{let dead=false;(async()=>{try{const u=await getCurrentUser();"
          effect="\n useEffect(()=>{if(!selected)return;let cancelled=false;if(!selected.messages.length){setSuggestions([]);setLoadingSuggestions(false);return()=>{cancelled=true}};const messages=selected.messages;setLoadingSuggestions(true);getSuggestions(messages).then(next=>{if(!cancelled&&next.length===3)setSuggestions(next)}).catch(()=>{}).finally(()=>{if(!cancelled)setLoadingSuggestions(false)});return()=>{cancelled=true}},[selected?.id,selected?.messages]);"+marker
          req(marker,effect)
          req("const match=convos.find(c=>c.kind==='space'?c.spaceId===msg.space_id:Boolean(partner)&&c.userId===partner);", "const current=convosRef.current;const match=current.find(c=>c.kind==='space'?c.spaceId===msg.space_id:Boolean(partner)&&c.userId===partner);",1)
          req("const sender=msg.sender_id===me.id?me.name:users[msg.sender_id]?.display_name||'Flexus user';", "const sender=msg.sender_id===me.id?me.name:'Flexus user';",1)
          req("{loadingSuggestions?<span className=\"text-[11px] text-muted-foreground\">Generating suggestions…</span>:suggestions.map(s=>", "{loadingSuggestions?[0,1,2].map(i=><div key={i} className=\"h-8 w-28 shrink-0 animate-pulse rounded-full border border-border bg-secondary/70\"/>):suggestions.map(s=>",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/study-kit/src/pages/chat.tsx
          git commit -m "Fix live Chat suggestion refresh" || exit 0
          git push
