name: Fix video transcription with direct Blob upload

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-video-upload:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Vercel Blob dependency
        run: |
          corepack enable
          pnpm add @vercel/blob -w

      - name: Patch transcription flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('artifacts/study-kit/src/App.tsx')
          text = app.read_text()
          if "from '@vercel/blob/client'" not in text:
              text = text.replace("import { ErrorBoundary } from '@/components/error-boundary';", "import { ErrorBoundary } from '@/components/error-boundary';\nimport { upload } from '@vercel/blob/client';")

          old = '''        if (videoFile) {
          const uploadResponse = await fetch('/api/transcribe-video-upload', {
            method: 'POST',
            headers: { 'Content-Type': videoFile.type || 'application/octet-stream', 'X-File-Name': videoFile.name },
            body: videoFile,
          });
          if (!uploadResponse.ok) {
            const payload = await uploadResponse.json().catch(() => null) as { error?: string } | null;
            throw new Error(payload?.error || 'Could not transcribe this upload.');
          }
          transcript = await uploadResponse.json() as { text: string; title: string };
        } else {'''
          new = '''        if (videoFile) {
          const blob = await upload(`lectures/${Date.now()}-${videoFile.name}`, videoFile, {
            access: 'public',
            handleUploadUrl: '/api/blob-upload',
            contentType: videoFile.type || 'video/mp4',
            multipart: true,
          });
          const transcriptionResponse = await fetch('/api/transcribe-video-upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: blob.url, fileName: videoFile.name, mimeType: videoFile.type || 'video/mp4' }),
          });
          const payload = await transcriptionResponse.json().catch(() => null) as { error?: string; text?: string; title?: string } | null;
          if (!transcriptionResponse.ok) throw new Error(payload?.error || `Transcription failed (${transcriptionResponse.status}).`);
          transcript = payload as { text: string; title: string };
        } else {'''
          if old not in text:
              raise SystemExit('Expected App.tsx transcription block was not found')
          text = text.replace(old, new, 1)
          app.write_text(text)
          PY

      - name: Replace transcription endpoint and add Blob token endpoint
        run: |
          cat > api/transcribe-video-upload.js <<'EOF'
          import { del } from '@vercel/blob';

          export const config = {
            api: { bodyParser: true },
          };

          function jsonBody(req) {
            if (req.body && typeof req.body === 'object') return req.body;
            return {};
          }

          export default async function handler(req, res) {
            if (req.method !== 'POST') return res.status(405).json({ error: 'Method not allowed.' });

            const apiKey = process.env.GROQ_API_KEY;
            if (!apiKey) return res.status(500).json({ error: 'GROQ_API_KEY is not configured in Vercel environment variables.' });

            const { url, fileName, mimeType } = jsonBody(req);
            if (!url || typeof url !== 'string') {
              return res.status(400).json({ error: 'No uploaded file URL was provided.' });
            }

            let blobUrl;
            try {
              blobUrl = new URL(url);
              if (!blobUrl.hostname.endsWith('.public.blob.vercel-storage.com')) {
                return res.status(400).json({ error: 'The upload URL must be a Vercel public Blob URL.' });
              }
            } catch {
              return res.status(400).json({ error: 'The uploaded file URL is invalid.' });
            }

            try {
              const form = new FormData();
              form.append('url', url);
              form.append('model', 'whisper-large-v3-turbo');
              form.append('response_format', 'json');

              const groqResponse = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                method: 'POST',
                headers: { Authorization: `Bearer ${apiKey}` },
                body: form,
              });

              if (!groqResponse.ok) {
                const body = await groqResponse.text().catch(() => '');
                let message = body.slice(0, 500);
                try {
                  const parsed = JSON.parse(body);
                  message = parsed?.error?.message || message;
                } catch {}
                return res.status(groqResponse.status).json({ error: `Groq transcription failed: ${message}` });
              }

              const data = await groqResponse.json();
              if (!data?.text?.trim()) return res.status(422).json({ error: 'No speech was detected in this upload.' });

              return res.status(200).json({ text: data.text.trim(), title: fileName || 'Lecture transcript' });
            } catch (error) {
              console.error('Video transcription failed:', error);
              return res.status(500).json({ error: error instanceof Error ? error.message : 'Could not transcribe this upload.' });
            } finally {
              try { await del(url); } catch (cleanupError) { console.warn('Blob cleanup failed:', cleanupError); }
            }
          }
          EOF

          cat > api/blob-upload.js <<'EOF'
          import { handleUpload } from '@vercel/blob/client';

          export default async function handler(req, res) {
            if (req.method !== 'POST') return res.status(405).json({ error: 'Method not allowed.' });

            try {
              const request = new Request(`https://${req.headers.host || 'localhost'}${req.url || '/api/blob-upload'}`, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify(req.body || {}),
              });

              const response = await handleUpload({
                body: req.body || {},
                request,
                onBeforeGenerateToken: async () => ({
                  allowedContentTypes: [
                    'video/mp4', 'video/webm', 'video/mpeg', 'video/ogg',
                    'audio/flac', 'audio/mpeg', 'audio/mp4', 'audio/ogg',
                    'audio/wav', 'audio/webm', 'audio/x-wav',
                  ],
                  maximumSizeInBytes: 100 * 1024 * 1024,
                  addRandomSuffix: true,
                }),
              });

              const body = await response.text();
              return res.status(response.status).setHeader('Content-Type', response.headers.get('content-type') || 'application/json').send(body);
            } catch (error) {
              console.error('Blob upload token failed:', error);
              return res.status(400).json({ error: error instanceof Error ? error.message : 'Could not initialize the upload.' });
            }
          }
          EOF

      - name: Remove this one-time workflow and commit
        run: |
          rm .github/workflows/fix-video-upload.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml artifacts/study-kit/src/App.tsx api/transcribe-video-upload.js api/blob-upload.js .github/workflows/fix-video-upload.yml
          git commit -m 'Fix large video transcription uploads'
          git push
