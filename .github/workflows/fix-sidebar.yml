name: Surgical sidebar fix
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch sidebar layout only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/study-kit/src/App.tsx')
          s = p.read_text()
          original = s
          s = s.replace('  Menu,\n  MoreHorizontal,', '  Menu,\n  MessageCircle,\n  MoreHorizontal,')
          s = s.replace("border-sidebar-border bg-sidebar px-5 py-6 transition-all md:translate-x-0 ${\n          collapsed ? 'md:w-[72px]' : 'md:w-[248px]'\n        } w-[248px]", "border-sidebar-border bg-sidebar py-6 transition-all md:translate-x-0 ${\n          collapsed ? 'md:w-[72px] md:px-3' : 'md:w-[248px] md:px-5'\n        } w-[248px] px-5")
          s = s.replace("className={`focus-ring flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm transition-colors ${", "className={`focus-ring flex items-center rounded-lg py-2.5 text-sm transition-colors ${collapsed ? 'justify-center px-2' : 'gap-3 px-3'} ${")
          s = s.replace('                <Icon\n                  size={17}', '                <Icon\n                  className="shrink-0"\n                  size={17}')
          s = s.replace('              >\n                <Icon', '                title={collapsed ? label : undefined}\n              >\n                <Icon')
          if s == original:
              raise SystemExit('No changes applied; expected sidebar patterns were not found.')
          p.write_text(s)
          PY
      - name: Commit surgical sidebar fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/study-kit/src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix collapsed sidebar icon sizing and tooltips"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-sidebar.yml || true
          git diff --cached --quiet || git commit -m "Remove temporary sidebar fix workflow"
          git push || true
