name: Fix Chat suggestions temporarily
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('artifacts/study-kit/src/pages/chat.tsx')
          s=p.read_text()
          s=s.replace("import { useEffect, useMemo, useState } from 'react';", "import { useEffect, useMemo, useRef, useState } from 'react';")
          old="async function getSuggestions(messages:UiMessage[]){if(!messages.length)return[];const context=messages.slice(-5).map(m=>({sender:m.sender,text:m.text}));const r=await fetch('/api/tutor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:`You are generating reply suggestions for a study workspace chat. Use the last five real messages as context. Return exactly 3 short, natural reply suggestions as a JSON array of strings. No markdown or explanation.\\n${JSON.stringify(context)}`,context:JSON.stringify(context)})});if(!r.ok)throw new Error('Tutor failed');return parseSuggestions(await r.text())}"
          new="async function getSuggestions(messages:UiMessage[]){if(!messages.length)return[];const context=messages.slice(-5).map(m=>({sender:m.sender,text:m.text}));const controller=new AbortController();const timeout=window.setTimeout(()=>controller.abort(),1800);try{const r=await fetch('/api/tutor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:`You are generating reply suggestions for a study workspace chat. Use ONLY the last five real messages as context. Return exactly 3 short, natural reply suggestions as a JSON array of strings. No markdown or explanation.\\n${JSON.stringify(context)}`,context:JSON.stringify(context),suggestions:true}),signal:controller.signal});if(!r.ok)throw new Error('Tutor failed');return parseSuggestions(await r.text())}finally{window.clearTimeout(timeout)}}"
          if old not in s: raise SystemExit('suggestion function not found')
          s=s.replace(old,new)
          old="export default function ChatPage(){const[me,setMe]=useState<AuthUser|null>(null);const[convos,setConvos]=useState<Conversation[]>([]);const[selectedId]"
          new="export default function ChatPage(){const[me,setMe]=useState<AuthUser|null>(null);const[convos,setConvos]=useState<Conversation[]>([]);const convosRef=useRef<Conversation[]>([]);const[selectedId]"
          if old not in s: raise SystemExit('component marker not found')
          s=s.replace(old,new)
          old="const[settings,setSettings]=useState<Space|null>(null);\n const selected=useMemo"
          new="const[settings,setSettings]=useState<Space|null>(null);\n convosRef.current=convos;\n const selected=useMemo"
          if old not in s: raise SystemExit('state marker not found')
          s=s.replace(old,new,1)
          old="const load=async(c:Conversation,user:AuthUser)=>{setLoadingMessages(true);setError('');try{const raw=c.kind==='dm'?await getMessagesForDm(user.id,c.userId):await getMessagesForSpace(c.spaceId);const ids=Array.from(new Set(raw.map(m=>m.sender_id).filter(id=>id!==user.id)));const us=await getUsersByIds(ids);const map={...users};us.forEach(u=>map[u.id]=u);setUsers(map);const ui=toUi(raw,map,user);setConvos(v=>v.map(x=>x.id===c.id?{...x,messages:ui}:x));setSuggestions([]);if(ui.length){setLoadingSuggestions(true);try{setSuggestions(await getSuggestions(ui))}catch{}finally{setLoadingSuggestions(false)}}}catch(e){setError(e instanceof Error?e.message:'Could not load messages.')}finally{setLoadingMessages(false)}};"
          new="const load=async(c:Conversation,user:AuthUser)=>{setLoadingMessages(true);setError('');try{const raw=c.kind==='dm'?await getMessagesForDm(user.id,c.userId):await getMessagesForSpace(c.spaceId);const ids=Array.from(new Set(raw.map(m=>m.sender_id).filter(id=>id!==user.id)));const us=await getUsersByIds(ids);const map={...users};us.forEach(u=>map[u.id]=u);setUsers(map);const ui=toUi(raw,map,user);setConvos(v=>v.map(x=>x.id===c.id?{...x,messages:ui}:x));}catch(e){setError(e instanceof Error?e.message:'Could not load messages.')}finally{setLoadingMessages(false)}};\n useEffect(()=>{if(!selected)return;let cancelled=false;if(!selected.messages.length){setSuggestions([]);setLoadingSuggestions(false);return()=>{cancelled=true}};const messages=selected.messages;setLoadingSuggestions(true);getSuggestions(messages).then(next=>{if(!cancelled&&next.length===3)setSuggestions(next)}).catch(()=>{}).finally(()=>{if(!cancelled)setLoadingSuggestions(false)});return()=>{cancelled=true}},[selected?.id,selected?.messages]);"
          if old not in s: raise SystemExit('load function not found')
          s=s.replace(old,new)
          old="const stop=subscribeToMessages(msg=>{const partner=msg.sender_id===me.id?msg.recipient_id:msg.sender_id;const match=convos.find(c=>c.kind==='space'?c.spaceId===msg.space_id:Boolean(partner)&&c.userId===partner);if(!match){refresh(me).catch(()=>{});return}const sender=msg.sender_id===me.id?me.name:users[msg.sender_id]?.display_name||'Flexus user';const ui={id:msg.id,senderId:msg.sender_id,sender,text:msg.text,createdAt:msg.created_at};setConvos(v=>v.map(c=>c.id===match.id?{...c,messages:c.messages.some(m=>m.id===ui.id)?c.messages:[...c.messages,ui]}:c))},setStatus);"
          new="const stop=subscribeToMessages(msg=>{const partner=msg.sender_id===me.id?msg.recipient_id:msg.sender_id;const current=convosRef.current;const match=current.find(c=>c.kind==='space'?c.spaceId===msg.space_id:Boolean(partner)&&c.userId===partner);if(!match){refresh(me).catch(()=>{});return}const sender=msg.sender_id===me.id?me.name:'Flexus user';const ui={id:msg.id,senderId:msg.sender_id,sender,text:msg.text,createdAt:msg.created_at};setConvos(v=>v.map(c=>c.id===match.id?{...c,messages:c.messages.some(m=>m.id===ui.id)?c.messages:[...c.messages,ui]}:c))},setStatus);"
          if old not in s: raise SystemExit('realtime function not found')
          s=s.replace(old,new)
          old="{loadingSuggestions?<span className=\"text-[11px] text-muted-foreground\">Generating suggestions…</span>:suggestions.map(s=>"
          new="{loadingSuggestions?[0,1,2].map(i=><div key={i} className=\"h-8 w-28 shrink-0 animate-pulse rounded-full border border-border bg-secondary/70\"/>):suggestions.map(s=>"
          if old not in s: raise SystemExit('chip renderer not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/study-kit/src/pages/chat.tsx
          git commit -m "Fix live Chat suggestion refresh" || exit 0
          git push
