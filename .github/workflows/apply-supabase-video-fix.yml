name: Apply Supabase video upload fix

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm add tus-js-client --filter @workspace/study-kit
      - run: node scripts/apply-supabase-video-fix.mjs
      - run: pnpm --filter @workspace/study-kit typecheck
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/study-kit/src/App.tsx artifacts/study-kit/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Supabase video upload and Groq transcription"
          git push
