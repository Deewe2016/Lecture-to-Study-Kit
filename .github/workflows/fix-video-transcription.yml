name: Fix video transcription

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install resumable upload client
        run: pnpm add tus-js-client --filter @workspace/study-kit

      - name: Patch video pipeline
        run: node <<'NODE'
import { readFile, writeFile } from 'node:fs/promises';

const appPath = 'artifacts/study-kit/src/App.tsx';
let app = await readFile(appPath, 'utf8');

if (!app.includes("import * as tus from 'tus-js-client';")) {
  const marker = "import * as pdfjsLib from 'pdfjs-dist';";
  if (!app.includes(marker)) throw new Error('App.tsx import marker not found');
  app = app.replace(marker, `${marker}\nimport * as tus from 'tus-js-client';`);
}

const authImport = "import { getCurrentUser, getStoredUser, signOut, type AuthUser } from '@/lib/auth';";
const authImportNew = "import { getCurrentUser, getStoredUser, getAccessToken, signOut, type AuthUser } from '@/lib/auth';";
if (app.includes(authImport)) app = app.replace(authImport, authImportNew);

const oldBlock = `        if (videoFile) {
          const uploadResponse = await fetch('/api/transcribe-video-upload', {
            method: 'POST',
            headers: { 'Content-Type': videoFile.type || 'application/octet-stream', 'X-File-Name': videoFile.name },
            body: videoFile,
          });
          if (!uploadResponse.ok) {
            const payload = await uploadResponse.json().catch(() => null) as { error?: string } | null;
            throw new Error(payload?.error || 'Could not transcribe this upload.');
          }
          transcript = await uploadResponse.json() as { text: string; title: string };
        } else {`;

if (!app.includes(oldBlock)) throw new Error('Original video upload block not found; refusing to make a partial edit.');

const newBlock = `        if (videoFile) {
          const accessToken = getAccessToken();
          const supabaseUrl = (import.meta.env.VITE_SUPABASE_URL || '').replace(/\\/$/, '');
          const anonKey = import.meta.env.VITE_SUPABASE_ANON_KEY || '';
          const projectRef = supabaseUrl.match(/^https?:\\/\\/([a-z0-9]+)\\.supabase\\.co$/i)?.[1];
          if (!accessToken || !projectRef || !anonKey) {
            throw new Error('Supabase video upload is not configured.');
          }

          const supportedTypes = new Set([
            'video/mp4', 'video/webm', 'video/quicktime',
            'audio/mpeg', 'audio/mp4', 'audio/wav', 'audio/x-wav', 'audio/ogg', 'audio/webm', 'audio/flac',
          ]);
          if (videoFile.type && !supportedTypes.has(videoFile.type)) {
            throw new Error('Unsupported video format. Please use MP4, MOV, or WebM.');
          }

          const safeName = videoFile.name.replace(/[^a-zA-Z0-9._-]+/g, '_');
          const userId = getStoredUser()?.id || 'user';
          const objectName = \`\${userId}/\${Date.now()}-\${safeName}\`;
          const contentType = videoFile.type || 'video/mp4';

          setError('Uploading video… 0%');
          const publicUrl = await new Promise<string>((resolve, reject) => {
            const upload = new tus.Upload(videoFile, {
              endpoint: \`https://\${projectRef}.storage.supabase.co/storage/v1/upload/resumable\`,
              retryDelays: [0, 3000, 5000, 10000, 20000],
              chunkSize: 6 * 1024 * 1024,
              headers: {
                authorization: \`Bearer \${accessToken}\`,
                apikey: anonKey,
              },
              metadata: {
                bucketName: 'video-uploads',
                objectName,
                contentType,
                cacheControl: '3600',
              },
              onError: (error) => reject(new Error(\`Supabase upload failed: \${error.message}\`)),
              onProgress: (uploaded, total) => {
                setError(\`Uploading video… \${Math.round((uploaded / total) * 100)}%\`);
              },
              onSuccess: () => {
                const encodedPath = objectName.split('/').map(encodeURIComponent).join('/');
                resolve(\`https://\${projectRef}.supabase.co/storage/v1/object/public/video-uploads/\${encodedPath}\`);
              },
            });

            upload.findPreviousUploads()
              .then((previous) => {
                if (previous.length > 0) upload.resumeFromPreviousUpload(previous[0]);
                upload.start();
              })
              .catch(reject);
          });

          setError('Video uploaded. Transcribing with Groq…');
          const uploadResponse = await fetch('/api/transcribe-video-upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: publicUrl, fileName: videoFile.name, mimeType: contentType }),
          });
          const payload = await uploadResponse.json().catch(() => null) as { error?: string; text?: string; title?: string } | null;
          if (!uploadResponse.ok) {
            throw new Error(payload?.error || \`Transcription failed (HTTP \${uploadResponse.status}).\`);
          }
          transcript = payload as { text: string; title: string };
          setError('');
        } else {`;

app = app.replace(oldBlock, newBlock);
app = app.replace('accept="video/mp4,audio/*,.mp4"', 'accept="video/mp4,video/quicktime,video/webm,audio/*,.mp4,.mov,.webm"');
app = app.replace('Upload MP4 or audio', 'Upload MP4, MOV, WebM, or audio');
await writeFile(appPath, app);
NODE

      - name: Replace transcription endpoint
        run: cat > api/transcribe-video-upload.js <<'JS'
const SUPABASE_HOST_SUFFIX = '.supabase.co';
const SUPABASE_BUCKET_PATH = '/storage/v1/object/public/video-uploads/';
const GROQ_URL = 'https://api.groq.com/openai/v1/audio/transcriptions';

function isAllowedSupabaseVideoUrl(value) {
  try {
    const url = new URL(value);
    return url.protocol === 'https:' &&
      url.hostname.endsWith(SUPABASE_HOST_SUFFIX) &&
      url.pathname.includes(SUPABASE_BUCKET_PATH);
  } catch {
    return false;
  }
}

async function groqError(response) {
  const text = await response.text().catch(() => '');
  let message = text.slice(0, 500);
  try {
    message = JSON.parse(text)?.error?.message || message;
  } catch {}
  return message || `Groq returned HTTP ${response.status}.`;
}

export default async function handler(req, res) {
  if (req.method !== 'POST') return res.status(405).json({ error: 'Method not allowed.' });

  const apiKey = process.env.GROQ_API_KEY;
  if (!apiKey) return res.status(500).json({ error: 'GROQ_API_KEY is not configured in Vercel environment variables.' });

  try {
    const body = typeof req.body === 'string' ? JSON.parse(req.body) : (req.body || {});
    const url = typeof body.url === 'string' ? body.url.trim() : '';
    const fileName = typeof body.fileName === 'string' && body.fileName.trim() ? body.fileName.trim() : 'lecture.mp4';

    if (!url) return res.status(400).json({ error: 'No uploaded video URL was provided.' });
    if (!isAllowedSupabaseVideoUrl(url)) return res.status(400).json({ error: 'The uploaded video URL is not a valid public video-uploads Supabase URL.' });

    const urlForm = new FormData();
    urlForm.append('url', url);
    urlForm.append('model', 'whisper-large-v3-turbo');
    urlForm.append('response_format', 'json');

    let groqResponse = await fetch(GROQ_URL, {
      method: 'POST',
      headers: { Authorization: `Bearer ${apiKey}` },
      body: urlForm,
    });

    // URL transcription is the normal path. If Groq rejects the URL, download the
    // object server-side and retry as a file. The browser never sends the video to Vercel.
    if (!groqResponse.ok) {
      const firstError = await groqError(groqResponse);
      console.warn('Groq URL transcription failed; trying server-side file fallback:', firstError);

      const fileResponse = await fetch(url);
      if (!fileResponse.ok) {
        return res.status(502).json({ error: `Supabase video could not be fetched for transcription (HTTP ${fileResponse.status}). Groq's URL attempt failed: ${firstError}` });
      }

      const rawForm = new FormData();
      rawForm.append('file', await fileResponse.blob(), fileName);
      rawForm.append('model', 'whisper-large-v3-turbo');
      rawForm.append('response_format', 'json');
      groqResponse = await fetch(GROQ_URL, {
        method: 'POST',
        headers: { Authorization: `Bearer ${apiKey}` },
        body: rawForm,
      });
    }

    if (!groqResponse.ok) {
      const message = await groqError(groqResponse);
      console.error('Groq transcription failed:', message);
      return res.status(502).json({ error: `Groq transcription failed: ${message}` });
    }

    const data = await groqResponse.json();
    if (!data?.text?.trim()) return res.status(422).json({ error: 'No speech was detected in this upload.' });

    return res.status(200).json({ text: data.text.trim(), title: fileName });
  } catch (error) {
    console.error('Video transcription failed:', error);
    return res.status(500).json({ error: error instanceof Error ? error.message : 'Could not transcribe this upload.' });
  }
}
JS

      - name: Verify
        run: |
          pnpm --filter @workspace/study-kit typecheck
          node --check api/transcribe-video-upload.js

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/study-kit/src/App.tsx artifacts/study-kit/package.json pnpm-lock.yaml api/transcribe-video-upload.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix large video transcription with Supabase Storage'
          git push
