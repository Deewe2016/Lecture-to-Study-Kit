name: Verify TipTap build
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/study-kit typecheck
