name: Apply study-kit tutor fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply targeted tutor changes
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 <<'PY'
          from pathlib import Path

          app_path = Path('artifacts/study-kit/src/App.tsx')
          text = app_path.read_text()

          marker = "function Overview({\n"
          helper = '''function renderInlineMarkdown(text: string) {
            const tokens = text.split(/(\\*\\*[^*]+\\*\\*|(?<!\\*)\\*[^*]+\\*(?!\\*))/g);
            return tokens.map((token, index) => {
              if (token.startsWith('**') && token.endsWith('**')) {
                return <strong key={index}>{token.slice(2, -2)}</strong>;
              }
              if (token.startsWith('*') && token.endsWith('*')) {
                return <em key={index}>{token.slice(1, -1)}</em>;
              }
              return <span key={index}>{token}</span>;
            });
          }

          '''
          if helper not in text:
              text = text.replace(marker, helper + marker, 1)

          old_answer = '''          {answer && (\n            <p\n              className="mt-4 border-t border-border pt-4 text-xs leading-5 text-muted-foreground"\n              data-testid="text-tutor-answer"\n            >\n              {answer}\n            </p>\n          )}'''
          new_answer = '''          {answer && (\n            <div\n              className="mt-4 border-t border-border pt-4 text-xs leading-5 text-muted-foreground"\n              data-testid="text-tutor-answer"\n            >\n              {renderInlineMarkdown(answer)}\n\n              <button\n                type="button"\n                onClick={() => {\n                  const message = `I want to learn more about ${kit.title}. Here is the study material: ${kit.overview}\\n\\n${kit.chapters\n                    .map((chapter) => `${chapter.title}: ${chapter.summary}`)\n                    .join('\\n\\n')}`;\n                  const id = `ai-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;\n                  const conversation = {\n                    id,\n                    messages: [\n                      {\n                        id: `ai-msg-${Date.now()}`,\n                        role: 'user' as const,\n                        content: message,\n                      },\n                    ],\n                    createdAt: Date.now(),\n                  };\n\n                  try {\n                    const existing = JSON.parse(\n                      localStorage.getItem('lecture-study-ai-conversations') || '[]',\n                    );\n                    const conversations = Array.isArray(existing) ? existing : [];\n                    localStorage.setItem(\n                      'lecture-study-ai-conversations',\n                      JSON.stringify([conversation, ...conversations]),\n                    );\n                    localStorage.removeItem('lecture-study-ai-chat');\n                  } catch {\n                    // Navigation still works if local storage is unavailable.\n                  }\n\n                  window.location.assign('/ai-chat');\n                }}\n                className="focus-ring mt-4 inline-flex items-center gap-2 rounded-lg border border-primary/30 bg-primary/5 px-3 py-2 text-xs font-semibold text-primary hover:bg-primary/10"\n                data-testid="button-dive-deeper"\n              >\n                <Sparkles size={14} />\n                Dive Deeper\n                <ArrowRight size={14} />\n              </button>\n            </div>\n          )}'''
          if old_answer not in text:
              raise SystemExit('Tutor answer block not found')
          text = text.replace(old_answer, new_answer, 1)
          app_path.write_text(text)
          PY

      - name: Commit targeted changes and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/study-kit/src/App.tsx
          git rm .github/workflows/update-tutor-study-kit.yml
          git commit -m "Fix study kit tutor rendering and add Dive Deeper"
          git push
